# Release the addons that changed (plans/RELEASE.md).
#
# Runs when `develop` is merged into `main`. `tools/changeset.py plan` lists every addon with
# pending changesets and its new version (last release tag + highest bump). For each: host
# tests, release build with that version and the update channel, tag `<addon>-v<version>` here,
# release `v<version>` in the addon's release-only repository (versions below 1.0.0 as
# pre-releases) and its `release/` folder (README, images) + LICENSE copied there. Afterwards the
# consumed changesets become CHANGELOG sections on `develop`.
#
# Safety switch: nothing is published unless the repository variable RELEASES_ENABLED is "true"
# (Settings > Secrets and variables > Actions > Variables); without it the plan is only shown.
# Publishing needs the secret RELEASE_TOKEN: a fine-grained token with "Contents: read and
# write" on the release repositories (GITHUB_TOKEN cannot write to other repositories).

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write          # tags here, CHANGELOG commit on develop

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # tags + history: which changesets are already released

      - name: Plan
        id: plan
        run: |
          python3 tools/changeset.py plan --json plan.json
          echo "count=$(python3 tools/changeset.py show plan.json count)" >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            python3 tools/changeset.py show plan.json summary
            [ "${{ vars.RELEASES_ENABLED }}" = "true" ] || echo "RELEASES_ENABLED is not 'true': nothing is published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Toolchain
        if: steps.plan.outputs.count != '0' && vars.RELEASES_ENABLED == 'true'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake g++ make

      - name: Tests
        if: steps.plan.outputs.count != '0' && vars.RELEASES_ENABLED == 'true'
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          cmake -S . -B build-host -DGW2_HOST_TESTS=ON
          cmake --build build-host -j 4
          ctest --test-dir build-host --output-on-failure

      - name: Build
        if: steps.plan.outputs.count != '0' && vars.RELEASES_ENABLED == 'true'
        run: |
          cmake -S . -B build -DTRAILPACK_RELEASE=ON $(python3 tools/changeset.py show plan.json cmake)
          cmake --build build -j 4

      - name: Tag and publish
        if: steps.plan.outputs.count != '0' && vars.RELEASES_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/changeset.py show plan.json tsv > releases.tsv   # also writes <tag>.md notes
          while IFS=$'\t' read -r tag version target repo name folder pre; do
            git tag -a "$tag" -m "$name $version"
            git push origin "$tag"
            flag=""; [ "$pre" = "true" ] && flag="--prerelease"
            gh release create "v$version" "build/$target.dll" $flag \
              --repo "$repo" --title "$name $version" --notes-file "$tag.md"
            rm -rf target
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$repo.git" target
            cp -r "$folder/release/." target/
            cp "$folder/LICENSE" target/LICENSE
            (cd target && git add -A && { git diff --cached --quiet || { git commit -q -m "$name $version: README" && git push -q; }; })
          done < releases.tsv

      - name: CHANGELOG on develop
        if: steps.plan.outputs.count != '0' && vars.RELEASES_ENABLED == 'true'
        run: |
          cp plan.json /tmp/plan.json
          cp releases.tsv /tmp/releases.tsv
          git fetch origin develop
          git checkout -B develop origin/develop
          python3 tools/changeset.py apply /tmp/plan.json
          git add -A .changeset trailpack-*/CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Release notes: $(cut -f1 /tmp/releases.tsv | paste -sd, -)"
            git push origin develop
          fi
