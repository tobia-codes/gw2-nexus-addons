# Release one addon (plans/RELEASE.md). Start it with `python3 tools/release.py <addon> <version>`.
#
# A tag `core-v<version>` / `memo-v<version>` (or `core-pre-v...` / `memo-pre-v...`) in this
# repository: check the tag against the DLL's version defines and the CHANGELOG section, run the
# host tests, build the DLL with MinGW, publish it as release `v<version>` in the addon's
# release-only repository (versions below 1.0.0 and `-pre-` tags as pre-releases) and copy the
# addon's `release/` folder (README, images) there.
#
# Nexus (UP_GitHub) reads those releases: it takes the highest `v<version>` tag and its first
# `.dll`, so every release repository holds exactly one addon.
#
# Needs the secret RELEASE_TOKEN: a fine-grained token with "Contents: read and write" on the
# release repositories (GITHUB_TOKEN cannot write to other repositories).

name: Release

on:
  push:
    tags: ['core-v*', 'memo-v*', 'core-pre-v*', 'memo-pre-v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Which addon
        id: addon
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            core-*) target=TrailpackCore; repo=tobia-codes/trailpack-core; dir=trailpack-core; name="Trailpack Core" ;;
            memo-*) target=TrailpackMemo; repo=tobia-codes/trailpack-memo; dir=trailpack-memo; name="Trailpack Memo" ;;
            *) echo "unknown tag $tag"; exit 1 ;;
          esac
          version="${tag##*-v}"
          pre=false
          case "$tag" in *-pre-v*) pre=true ;; esac
          case "$version" in 0.*) pre=true ;; esac
          {
            echo "target=$target"; echo "repo=$repo"; echo "dir=$dir"; echo "name=$name"
            echo "version=$version"; echo "pre=$pre"
          } >> "$GITHUB_OUTPUT"

      - name: Tag matches the DLL version and the changelog
        run: |
          main="${{ steps.addon.outputs.dir }}/src/dllmain.cpp"
          v() { grep -E "^#define $1 " "$main" | awk '{print $3}'; }
          dll="$(v V_MAJOR).$(v V_MINOR).$(v V_BUILD)"
          [ "$(v V_REVISION)" != "0" ] && dll="$dll.$(v V_REVISION)"
          tag="${{ steps.addon.outputs.version }}"
          if [ "$tag" != "$dll" ]; then
            echo "Tag version $tag does not match the DLL version $dll (V_* in $main)."
            exit 1
          fi
          # Release notes: the CHANGELOG section of this version (must exist and not be empty).
          awk -v v="$tag" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## /          { exit }
            on                    { print }
          ' "${{ steps.addon.outputs.dir }}/CHANGELOG.md" > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No '## $tag' section with entries in ${{ steps.addon.outputs.dir }}/CHANGELOG.md."
            exit 1
          fi

      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake g++ make

      - name: Host tests
        run: |
          cmake -S . -B build-host -DGW2_HOST_TESTS=ON
          cmake --build build-host -j 4
          ctest --test-dir build-host --output-on-failure

      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build --target ${{ steps.addon.outputs.target }} -j 4

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          version="${{ steps.addon.outputs.version }}"
          pre=""
          [ "${{ steps.addon.outputs.pre }}" = "true" ] && pre="--prerelease"
          gh release create "v$version" "build/${{ steps.addon.outputs.target }}.dll" $pre \
            --repo "${{ steps.addon.outputs.repo }}" \
            --title "${{ steps.addon.outputs.name }} $version" \
            --notes-file notes.md

      - name: Sync README and images
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ steps.addon.outputs.repo }}.git" target
          cp -r "${{ steps.addon.outputs.dir }}/release/." target/
          cp "${{ steps.addon.outputs.dir }}/LICENSE" target/LICENSE
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "${{ steps.addon.outputs.name }} ${{ steps.addon.outputs.version }}: README"
            git push
          fi
