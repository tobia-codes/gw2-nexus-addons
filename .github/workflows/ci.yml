# Every push and pull request: tests first (tool tests, host tests), then the DLL builds (the
# Definition of Done in the addons' AGENTS.md). A failing test stops the build. Required for pull
# requests into main ("test-and-build"); on develop it only informs.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake g++ make

      - name: Tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Changesets are valid
        run: python3 tools/changeset.py status

      - name: Host tests
        run: |
          cmake -S . -B build-host -DGW2_HOST_TESTS=ON
          cmake --build build-host -j 4
          ctest --test-dir build-host --output-on-failure

      - name: Build DLLs
        run: |
          cmake -S . -B build
          cmake --build build -j 4
          ls -l build/*.dll
